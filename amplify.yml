version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm list @aws-sdk/client-bedrock-runtime || echo "Package not found"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
